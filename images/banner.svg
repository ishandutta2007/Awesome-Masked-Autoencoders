<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" fill="none" viewBox="0 0 1000 250"><defs><linearGradient id="grad" x1="0" x2="1000" y1="0" y2="250" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#FF512F"/><stop offset="100%" stop-color="#DD2476"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern></defs><rect width="1000" height="250" fill="url(#grad)" rx="20"/><rect width="1000" height="250" fill="url(#grid)" rx="20"/><text x="500" y="110" fill="#FFF" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="900" text-anchor="middle">Awesome Masked Autoencoders</text><text x="500" y="160" fill="#FFF" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" opacity=".9" text-anchor="middle">&amp; Self-Supervised Learning</text><g transform="translate(150, 125)"><circle cx="0" cy="0" r="50" fill="none" stroke="#fff" stroke-dasharray="15 15" stroke-width="4" opacity=".6"><animateTransform attributeName="transform" dur="15s" from="0" repeatCount="indefinite" to="360" type="rotate"/></circle><circle cx="0" cy="0" r="30" fill="#fff" opacity=".2"/></g><g transform="translate(850, 125)"><circle cx="0" cy="0" r="50" fill="none" stroke="#fff" stroke-dasharray="15 15" stroke-width="4" opacity=".6"><animateTransform attributeName="transform" dur="15s" from="360" repeatCount="indefinite" to="0" type="rotate"/></circle><circle cx="0" cy="0" r="30" fill="#fff" opacity=".2"/></g></svg>